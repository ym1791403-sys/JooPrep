<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#080e1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Core Brand Gradient: Indigo -> Cyan -> Emerald -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="45%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00c982" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c982" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00c982" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Rounded Hexagon / Shield Container -->
  <path d="M256 32 
           C285 32 420 85 435 105 
           C450 125 450 340 435 365 
           C420 390 285 470 256 480 
           C227 470 92 390 77 365 
           C62 340 62 125 77 105 
           C92 85 227 32 256 32 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#brandGrad)" 
        stroke-width="8" 
        stroke-linejoin="round"
        filter="url(#dropShadow)" />

  <!-- Inner Tech Circuit Geometry / Hex Lattice -->
  <path d="M256 60 L410 120 V340 L256 445 L102 340 V120 Z" 
        stroke="#1e293b" 
        stroke-width="3" 
        stroke-dasharray="6 6" 
        opacity="0.6" />

  <!-- Academic Graduation Cap Top Diamond (3D Faceted) -->
  <g filter="url(#softGlow)">
    <!-- Main Cap Top Rhombus -->
    <polygon points="256,120 390,185 256,245 122,185" 
             fill="url(#brandGrad)" 
             opacity="0.95" />

    <!-- Left Facet Shading -->
    <polygon points="256,120 122,185 256,245" 
             fill="#ffffff" 
             opacity="0.12" />

    <!-- Cap Under Skullcap / Base Band -->
    <path d="M175 210 V255 C175 285 337 285 337 255 V210 L256 245 Z" 
          fill="#0f172a" 
          stroke="url(#brandGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Cap Button & Golden Tassel -->
    <circle cx="256" cy="182" r="8" fill="url(#goldGrad)" />
    <!-- Tassel String and Fringe -->
    <path d="M256 182 Q330 190 348 245" 
          fill="none" 
          stroke="url(#goldGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <path d="M348 245 L354 285 M348 245 L346 287 M348 245 L340 284" 
          stroke="url(#goldGrad)" 
          stroke-width="3" 
          stroke-linecap="round" />
  </g>

  <!-- Engineering Circuit & Code Chevron: "< J P >" -->
  <g>
    <!-- Left Tech Code Bracket '<' -->
    <path d="M165 295 L125 330 L165 365" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Right Tech Code Bracket '>' -->
    <path d="M347 295 L387 330 L347 365" 
          fill="none" 
          stroke="url(#brandGrad)" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Interlocking JP Ribbon / Circuit Core in the Center -->
    <path d="M215 310 H250 V375 C250 395 230 405 210 400" 
          fill="none" 
          stroke="#00c982" 
          stroke-width="8" 
          stroke-linecap="round" />
    
    <path d="M260 310 H295 C315 310 325 325 325 340 C325 355 315 365 295 365 H260 V410" 
          fill="none" 
          stroke="#06b6d4" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Circuit Nodes / Connection Points -->
    <circle cx="210" cy="400" r="5" fill="#00c982" />
    <circle cx="260" cy="410" r="5" fill="#06b6d4" />
    <circle cx="125" cy="330" r="4.5" fill="#6366f1" />
    <circle cx="387" cy="330" r="4.5" fill="#00c982" />
  </g>

  <!-- Specular Sparkle / Star (Top Right) -->
  <g transform="translate(390, 80) scale(0.9)">
    <path d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z" 
          fill="url(#goldGrad)" 
          filter="url(#softGlow)" />
  </g>
</svg>
